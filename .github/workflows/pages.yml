name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'engine/README.md'
      - 'engine/docs/**'
      - 'engine/mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build docs
        working-directory: engine
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md').read_text()
          readme = readme.replace('(docs/', '(')
          readme = readme.replace('](../LICENSE)', '](https://github.com/caeus/dagr/blob/main/LICENSE)')
          Path('docs/index.md').write_text(readme)
          PY

          python -m pip install 'mkdocs-material==9.7.7'
          mkdocs build
          test -f site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: engine/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
