name: Publish stacks

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [di, typescript]
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: stack
        env:
          STACK: ${{ matrix.stack }}
        run: echo "tree_sha=$(git rev-parse HEAD:stacks/$STACK)" >> "$GITHUB_OUTPUT"

      - name: Build and push platform images with dagr
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dagr-stacks-${{ matrix.stack }}
          SOURCE: https://github.com/${{ github.repository }}
          STACK: ${{ matrix.stack }}
          TREE_SHA: ${{ steps.stack.outputs.tree_sha }}
        run: |
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/$arch" sh .dagr/cli.sh run "//stacks:ci:image-$STACK"
            printf 'FROM %s\n' "stacks-ci-image-$STACK" | docker build \
              --platform "linux/$arch" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --tag "$IMAGE:$TREE_SHA-$arch" \
              -
            test "$(docker image inspect "$IMAGE:$TREE_SHA-$arch" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "$SOURCE"
            docker push "$IMAGE:$TREE_SHA-$arch"
          done

      - name: Publish multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dagr-stacks-${{ matrix.stack }}
          TREE_SHA: ${{ steps.stack.outputs.tree_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TREE_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$TREE_SHA-amd64" \
            "$IMAGE:$TREE_SHA-arm64"
