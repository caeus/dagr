name: Publish recipes

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        recipe: [rdk, typescript]
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: recipe
        env:
          RECIPE: ${{ matrix.recipe }}
        run: echo "tree_sha=$(git rev-parse HEAD:recipes/$RECIPE)" >> "$GITHUB_OUTPUT"

      - name: Build and push platform images with dagr
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dagr-recipes-${{ matrix.recipe }}
          SOURCE: https://github.com/${{ github.repository }}
          RECIPE: ${{ matrix.recipe }}
          TREE_SHA: ${{ steps.recipe.outputs.tree_sha }}
        run: |
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/$arch" sh .dagr/cli.sh run "//recipes:ci:image-$RECIPE"
            printf 'FROM %s\n' "recipes-ci-image-$RECIPE" | docker build \
              --platform "linux/$arch" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --tag "$IMAGE:$TREE_SHA-$arch" \
              -
            test "$(docker image inspect "$IMAGE:$TREE_SHA-$arch" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "$SOURCE"
            docker push "$IMAGE:$TREE_SHA-$arch"
          done

      - name: Publish multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dagr-recipes-${{ matrix.recipe }}
          TREE_SHA: ${{ steps.recipe.outputs.tree_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TREE_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$TREE_SHA-amd64" \
            "$IMAGE:$TREE_SHA-arm64"
