name: PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the unified graph
        run: |
          sh .dagr/cli.sh run \
            //engine:/engine/build \
            //engine:/engine/typecheck \
            //engine:/engine/test \
            //engine:/engine/bundlecheck \
            //engine:/engine/image \
            //recipes:/test \
            //recipes:/composition-test \
            //recipes:/boundaries \
            //recipes:/image-typescript \
            //harness:/test \
            //engine/examples/starter:/hello

      - name: Smoke-test self-built image
        run: |
          TAG="dagr-$(printf '%s' '//engine:/engine/image' | sha256sum | cut -d ' ' -f 1)"
          LIST_OUTPUT="$(docker run --rm \
            -v "$PWD:/repo" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOST_REPO_ROOT="$PWD" \
            -e MOUNT_ROOT=/tmp/dagr-mounts \
            -e CLEAN_MOUNT_ROOT=1 \
            -e WORKING_DIR="$PWD" \
            -e HOST_OS=linux \
            -e HOST_ARCH=x64 \
            -e HOST_LIBC=glibc \
            "$TAG" list)"
          printf '%s\n' "$LIST_OUTPUT"
          printf '%s\n' "$LIST_OUTPUT" | grep -q '^//engine:/engine/build'
          printf '%s\n' "$LIST_OUTPUT" | grep -q '^//recipes:/test'
