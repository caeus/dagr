name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dagr checks
        run: sh .dagr/cli.sh run //:ci:build //:ci:typecheck //:ci:test //:ci:bundlecheck //:ci:image

      - name: Smoke-test self-built image
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOST_REPO_ROOT="$PWD" \
            -e MOUNT_ROOT=/tmp/dagr-mounts \
            -e CLEAN_MOUNT_ROOT=1 \
            -e WORKING_DIR="$PWD" \
            -e HOST_OS=linux \
            -e HOST_ARCH=x64 \
            -e HOST_LIBC=glibc \
            ci-image list > /dev/null
