name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dagr checks
        run: |
          sh .dagr/cli.sh run \
            //engine:ci:build \
            //engine:ci:typecheck \
            //engine:ci:test \
            //engine:ci:bundlecheck \
            //engine:ci:image \
            //stacks:ci:test \
            //stacks:ci:image-di \
            //stacks:ci:image-typescript

      - name: Smoke-test self-built image
        run: |
          LIST_OUTPUT="$(docker run --rm \
            -v "$PWD:/repo" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOST_REPO_ROOT="$PWD" \
            -e MOUNT_ROOT=/tmp/dagr-mounts \
            -e CLEAN_MOUNT_ROOT=1 \
            -e WORKING_DIR="$PWD" \
            -e HOST_OS=linux \
            -e HOST_ARCH=x64 \
            -e HOST_LIBC=glibc \
            engine-ci-image list)"
          printf '%s\n' "$LIST_OUTPUT"
          printf '%s\n' "$LIST_OUTPUT" | grep -q '^//engine:'
          printf '%s\n' "$LIST_OUTPUT" | grep -q '^//stacks:'
