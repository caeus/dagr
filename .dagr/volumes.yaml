"github.com/caeus/dagr-recipes/typescript":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/typescript/
        dest: /src/
    # The repository launcher is pinned to the previous engine. Rewrite only this workspace mount so
    # that engine can bootstrap the next engine; published TypeScript recipe images keep dagr:rdk.
    - COPY:
        src: recipes/tests/dagr.rdk-fixture.js
        dest: /src/dagr.rdk.js
    - RUN: sed -i "s|from 'dagr:rdk'|from '//dagr.rdk.js'|" /src/dagr.*.js
    - WORKDIR: /src
  IGNORE:
    - .git

# Subtrees the test harness mounts. Only the harness uses these: they exist so a test can see two
# packages at once without either package reaching outside itself.
"github.com/caeus/dagr/recipes":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/
        dest: /src/
    - WORKDIR: /src
  IGNORE:
    - .git

"github.com/caeus/dagr/engine":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: engine/dagr.index.js
        dest: /src/
    - COPY:
        src: engine/recipes/
        dest: /src/recipes/
    - WORKDIR: /src
  IGNORE:
    - .git
