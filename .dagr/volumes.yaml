"github.com/caeus/dagr-recipes/typescript":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/typescript/
        dest: /src/
    - WORKDIR: /src
  IGNORE:
    - .git

# Subtrees the test harness mounts. Only the harness uses these: they exist so a test can see two
# packages at once without either package reaching outside itself.
"github.com/caeus/dagr/recipes":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/
        dest: /src/
    - WORKDIR: /src
  IGNORE:
    - .git

"github.com/caeus/dagr/engine":
  FROM: alpine:3.22
  steps:
    # The engine/ prefix is preserved: the index imports its recipe as
    # //engine/recipes/typescript//dagr.recipe.js, so that mount has to sit where it expects it.
    - COPY:
        src: engine/dagr.index.js
        dest: /src/engine/
    - COPY:
        src: engine/dagr.engine.js
        dest: /src/engine/
    - COPY:
        src: engine/recipes/
        dest: /src/engine/recipes/
    - WORKDIR: /src
  IGNORE:
    - .git
