"github.com/caeus/dagr-recipes/typescript":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/typescript/
        dest: /src/
    - WORKDIR: /src
  IGNORE:
    - .git

# Subtrees the test harness mounts. Only the harness uses these: they exist so a test can see two
# packages at once without either package reaching outside itself.
"github.com/caeus/dagr/recipes":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: recipes/
        dest: /src/
    - WORKDIR: /src
  IGNORE:
    - .git

"github.com/caeus/dagr/engine":
  FROM: alpine:3.22
  steps:
    - COPY:
        src: engine/dagr.index.js
        dest: /src/
    - COPY:
        src: engine/recipes/
        dest: /src/recipes/
    - WORKDIR: /src
  IGNORE:
    - .git
